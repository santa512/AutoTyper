name: Build Auto Typer release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing main-x64 release tag (for example v0.3.2)
        required: true
        default: v0.3.2
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-platforms.yml
    with:
      source-ref: ${{ inputs.tag || github.ref_name }}
      edition: winui
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release
      - name: Publish verified downloads
        shell: bash
        run: |
          set -euo pipefail
          cd dist/release
          sha256sum --check --strict ./*.sha256
          cd ../..
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Auto Typer $RELEASE_TAG" --notes-file "release-notes/$RELEASE_TAG.md"
          else
            gh release edit "$RELEASE_TAG" --notes-file "release-notes/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" dist/release/*.exe dist/release/*.msi dist/release/*.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest

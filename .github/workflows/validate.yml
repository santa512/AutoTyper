name: Validate Auto Typer

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build main edition
        shell: pwsh
        run: dotnet build AutoTyper.csproj -c Release -p:Platform=x64
      - name: Check main-edition features
        shell: pwsh
        run: |
          foreach ($project in @('QrDecoder.Tests', 'Screenshot.Tests', 'Ocr.Tests', 'Sharing.Tests', 'SingleInstance.Tests')) {
            dotnet run --project "tests/$project" -c Release
            if ($LASTEXITCODE -ne 0) { throw "$project failed." }
          }
      - name: Build and test Compact
        shell: pwsh
        run: |
          cmake -S native -B native/build -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'Compact configuration failed.' }
          cmake --build native/build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Compact build failed.' }
          ctest --test-dir native/build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Compact tests failed.' }
      - name: Check download page
        shell: pwsh
        run: |
          node --check docs/release.js
          if ($LASTEXITCODE -ne 0) { throw 'Download script syntax failed.' }
          node scripts/Test-DownloadPage.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Download page checks failed.' }
